name: Linux build and tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sanitizer: [none, address]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopencv-dev nlohmann-json3-dev python3-opencv
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DVISIONFLOW_ENABLE_ASAN=${{ matrix.sanitizer == 'address' && 'ON' || 'OFF' }}
          -DVISIONFLOW_ENABLE_UBSAN=${{ matrix.sanitizer == 'address' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: cmake -E chdir build/ci ctest --output-on-failure
